spring.application.name=skincare-api

server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Cloud SQL via Socket Factory (Cloud Run)
spring.datasource.url=jdbc:postgresql://google/${DB_NAME:glowlab_db}?cloudSqlInstance=${INSTANCE_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.postgres.SocketFactory
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=2

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# CORS — origenes permitidos (separados por coma)
cors.allowed-origins=http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,https://glowlab-api-994118614969.us-central1.run.app

# Email — Gmail SMTP (configurar MAIL_USERNAME y MAIL_PASSWORD como variables de entorno)
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google Gemini API
gemini.api-key=${GEMINI_API_KEY:}

# JWT — clave secreta (base64, mínimo 32 bytes). Sobreescribir con env var JWT_SECRET en producción
jwt.secret=Z2xvd2xhYi1qd3Qtc2VjcmV0LWtleS0yMDI2LXByb2Q=

# Monitoring — Prometheus metrics en /metrics
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.prometheus=metrics
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99